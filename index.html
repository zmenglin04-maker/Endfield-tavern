<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EndField Tavern — 终末地放映室与小酒馆</title>
<style>
:root{
  --gold:#c9a86e;--gold-lt:#e2cd9a;--gold-dk:#7a6128;
  --teal:#5ec5b4;--violet:#a890e0;--blue:#7ba8d4;
  --text-1:#ece6dc;--text-2:#b8aea0;--text-3:#716a78;
  --err:#e86070;
  --panel:rgba(8,7,20,.78);--glass:rgba(14,12,30,.60);
  --brd:rgba(200,185,230,.14);--brd-gold:rgba(201,168,110,.35);
  --r:16px;--r-sm:10px;
  --sh:0 8px 36px rgba(0,0,0,.55);
  --fd:"Noto Serif SC","STSong",serif;
  --fb:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:var(--fb);color:var(--text-1);overflow:hidden}
body{background:#070711;-webkit-font-smoothing:antialiased;position:relative}

/* ── 全屏背景 ── */
#bg{position:fixed;inset:0;background-size:cover;background-position:center;transition:background-image 1.5s ease-in-out;z-index:0}
#bgVeil{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to bottom,rgba(4,3,14,.18) 0%,rgba(4,3,14,.08) 40%,rgba(4,3,14,.55) 85%,rgba(4,3,14,.85) 100%)}
#stars{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.4}

/* ── 大计时数字（浮在背景上） ── */
#bigTime{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-55%);
  z-index:5;pointer-events:none;
  font-family:var(--fd);font-size:clamp(5rem,16vw,11rem);
  font-weight:300;letter-spacing:.08em;
  color:rgba(236,230,220,.92);
  text-shadow:0 0 60px rgba(94,197,180,.35),0 2px 24px rgba(0,0,0,.7);
  font-variant-numeric:tabular-nums;
  opacity:0;transition:opacity .6s;
  line-height:1;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
#bigTime.show{opacity:1}
#bigTimeLbl{font-size:clamp(.9rem,2.5vw,1.3rem);letter-spacing:.18em;color:var(--gold-lt);
  text-shadow:0 0 20px rgba(201,168,110,.4);font-weight:400}

/* ── 左下角电视 ── */
#tvZone{
  position:fixed;bottom:90px;left:24px;z-index:10;
  display:flex;flex-direction:column;gap:8px;
}
.tv-shell{
  position:relative;width:200px;height:174px;
  background:linear-gradient(155deg,#2a2048,#1a1638);
  border:2px solid #3c3260;border-radius:18px;
  box-shadow:0 0 0 1px #2a2540,0 8px 32px rgba(0,0,0,.7),0 0 40px rgba(94,197,180,.07),inset 0 0 16px rgba(0,0,0,.3);
  flex-shrink:0;
}
.tv-screen{
  position:absolute;top:12px;left:12px;right:12px;bottom:30px;
  background:radial-gradient(ellipse at 50% 30%,#141032,#080620 75%);
  border-radius:10px;border:1.5px solid #2d2450;overflow:hidden;cursor:pointer;
}
.tv-scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.10) 2px,rgba(0,0,0,.10) 3px);pointer-events:none;z-index:6;border-radius:8px}
.tv-glow{position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 22px rgba(94,197,180,.09);pointer-events:none;z-index:5}
.tv-ant{position:absolute;top:-22px;left:50%;transform:translateX(-50%);display:flex;gap:16px}
.tv-ant span{width:2px;height:20px;background:linear-gradient(to top,#3a3060,#605890);border-radius:2px;transform-origin:bottom}
.tv-ant span:first-child{transform:rotate(-18deg)}.tv-ant span:last-child{transform:rotate(18deg)}
.tv-base{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:7px}
.tv-knob{width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#5a4a80,#282040);border:1px solid #4a3a68}
.tv-spkr{display:flex;gap:2px}.tv-spkr span{width:2px;height:7px;background:#2d2450;border-radius:1px}
.tv-legs{position:absolute;bottom:-10px;left:28px;right:28px;display:flex;justify-content:space-between}
.tv-legs span{width:5px;height:10px;background:linear-gradient(to bottom,#3c3260,#1a1638);border-radius:0 0 3px 3px}
.char-disp{position:absolute;inset:0;z-index:2;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.char-tv{height:95%;width:100%;object-fit:contain;object-position:center bottom;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);cursor:grab;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 0 8px rgba(94,197,180,.22))}
.char-tv:hover{transform:scale(1.04)}.char-tv:active{cursor:grabbing}
.game-illus{position:absolute;inset:0;z-index:3;width:100%;height:100%;object-fit:cover;object-position:center;opacity:0;transition:opacity .8s ease;pointer-events:none}
.game-illus.on{opacity:1}
.play-badge{position:absolute;top:5px;left:5px;z-index:7;font-size:.55rem;letter-spacing:.05em;
  color:var(--teal);background:rgba(8,7,20,.75);border:1px solid rgba(94,197,180,.4);
  border-radius:20px;padding:1px 6px;opacity:0;transition:opacity .3s;pointer-events:none}
.play-badge.on{opacity:1}

/* char selector below TV */
.char-row{display:flex;gap:6px;flex-wrap:wrap}
.char-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;border:none;cursor:pointer;transition:transform .15s}
.char-btn:hover{transform:translateY(-2px)}
.char-btn.active .ct-wrap{border-color:var(--gold);box-shadow:0 0 10px rgba(201,168,110,.3)}
.ct-wrap{width:36px;height:36px;border-radius:50%;overflow:hidden;border:2px solid var(--brd);transition:all .18s;background:#0d0b1e}
.ct-img{width:100%;height:100%;object-fit:cover;object-position:top center}
.ct-lbl{font-size:.58rem;color:var(--text-3);white-space:nowrap}

/* quote card: sits above the TV, never over the avatar row, auto-hides */
#quoteCard{
  position:fixed;bottom:300px;left:24px;z-index:11;
  max-width:300px;min-width:180px;
  background:var(--panel);border:1px solid var(--brd-gold);border-radius:var(--r);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  padding:12px 14px;
  box-shadow:var(--sh),0 0 20px rgba(201,168,110,.08);
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .3s,transform .3s;
}
#quoteCard.show{opacity:1;transform:translateY(0)}
#quoteCard::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,168,110,.3),transparent)}
.qc-text{font-size:.8rem;line-height:1.6;color:var(--text-2);padding-left:8px;position:relative}
.qc-text::before{content:'\201C';position:absolute;top:-4px;left:-4px;font-size:1.6rem;color:var(--gold-dk);font-family:var(--fd);opacity:.5;line-height:1}
.qc-name{font-size:.68rem;color:var(--gold);text-align:right;margin-top:6px;letter-spacing:.05em}

/* ── 顶部状态栏 ── */
#topBar{
  position:fixed;top:0;left:0;right:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 20px;
  background:linear-gradient(to bottom,rgba(4,3,14,.72),transparent);
}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--gold),var(--gold-dk));display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 0 16px rgba(201,168,110,.3)}
.brand h1{font-family:var(--fd);font-size:1.1rem;color:var(--gold-lt);letter-spacing:.05em;text-shadow:0 0 16px rgba(201,168,110,.4)}
.brand p{font-size:.65rem;color:var(--text-3);margin-top:1px}
.mode-tabs{display:flex;gap:5px}
.mode-btn{padding:5px 13px;background:rgba(10,9,24,.55);border:1px solid var(--brd);border-radius:30px;color:var(--text-2);font-size:.75rem;cursor:pointer;transition:all .18s;font-family:var(--fb);backdrop-filter:blur(10px)}
.mode-btn:hover{background:var(--glass);color:var(--text-1)}
.mode-btn.active{background:linear-gradient(135deg,rgba(201,168,110,.22),rgba(201,168,110,.06));border-color:var(--gold);color:var(--gold-lt)}

/* ── 计时控制面板（右侧浮动，收起/展开） ── */
#timerPanel{
  position:fixed;right:20px;bottom:90px;z-index:10;
  width:220px;
  background:var(--panel);border:1px solid var(--brd);border-radius:var(--r);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:var(--sh);overflow:hidden;
  transition:max-height .3s ease,opacity .3s;
  max-height:600px;
}
#timerPanel.collapsed{max-height:46px;opacity:.85}
.tp-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none}
.tp-title{font-family:var(--fd);font-size:.82rem;color:var(--gold);display:flex;align-items:center;gap:6px}
.tp-title::before{content:"";width:3px;height:12px;background:var(--gold);border-radius:2px}
.tp-toggle{font-size:.75rem;color:var(--text-3);transition:transform .3s}
#timerPanel.collapsed .tp-toggle{transform:rotate(180deg)}
.tp-body{padding:0 14px 14px}
.mode-row{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.mode-pill{padding:3px 10px;border-radius:30px;font-size:.7rem;border:1px solid var(--brd);color:var(--text-3);cursor:pointer;transition:all .18s}
.mode-pill.study.active{background:rgba(94,197,180,.13);border-color:var(--teal);color:var(--teal)}
.mode-pill.work.active{background:rgba(123,168,212,.13);border-color:var(--blue);color:var(--blue)}
.mode-pill.sleep.active{background:rgba(168,144,224,.13);border-color:var(--violet);color:var(--violet)}

.hg-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.hg-svg{width:48px;height:60px;flex-shrink:0;filter:drop-shadow(0 0 5px rgba(201,168,110,.12))}
.td-mini{text-align:center}
.td-num{font-family:var(--fd);font-size:2.2rem;letter-spacing:.04em;color:var(--text-1);text-shadow:0 0 16px rgba(94,197,180,.22);line-height:1;font-variant-numeric:tabular-nums;transition:color .4s}
.td-lbl{font-size:.64rem;color:var(--text-3);margin-top:3px;letter-spacing:.06em}

.t-cfg{display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.t-cfg label{font-size:.74rem;color:var(--text-3)}
.t-input{width:56px;padding:5px 7px;background:var(--glass);border:1px solid var(--brd);border-radius:var(--r-sm);color:var(--text-1);font-size:.82rem;font-family:var(--fb);outline:none;transition:border-color .18s;text-align:center}
.t-input:focus{border-color:var(--gold)}.t-input.err{border-color:var(--err)}
.err-msg{font-size:.68rem;color:var(--err);display:none}.err-msg.show{display:block}
.dir-tog{display:flex;background:var(--glass);border:1px solid var(--brd);border-radius:var(--r-sm);overflow:hidden}
.dir-btn{padding:5px 10px;background:transparent;border:none;color:var(--text-3);font-size:.72rem;cursor:pointer;transition:all .18s;font-family:var(--fb)}
.dir-btn.active{background:linear-gradient(135deg,rgba(94,197,180,.18),rgba(94,197,180,.06));color:var(--teal)}
.t-ctrl{display:flex;gap:7px;margin-top:4px}
.btn-p{flex:1;padding:9px 0;background:linear-gradient(135deg,rgba(201,168,110,.24),rgba(201,168,110,.08));border:1px solid var(--gold);border-radius:var(--r-sm);color:var(--gold-lt);font-size:.82rem;cursor:pointer;transition:all .18s;font-family:var(--fb)}
.btn-p:hover{box-shadow:0 0 14px rgba(201,168,110,.2)}.btn-p:disabled{opacity:.5;cursor:default}
.btn-s{padding:9px 12px;background:var(--glass);border:1px solid var(--brd);border-radius:var(--r-sm);color:var(--text-2);font-size:.82rem;cursor:pointer;transition:all .18s;font-family:var(--fb)}
.btn-s:hover{background:var(--panel);color:var(--text-1)}.btn-s:disabled{opacity:.5;cursor:default}
.s-log{margin-top:10px;overflow-y:auto;max-height:70px}
.s-log::-webkit-scrollbar{width:3px}.s-log::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}
.stat-box{background:var(--glass);border:1px solid var(--brd);border-radius:var(--r-sm);padding:8px 10px;margin-bottom:10px}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:2px 0}
.stat-k{font-size:.68rem;color:var(--text-3);letter-spacing:.04em}
.stat-v{font-size:.74rem;color:var(--teal);font-family:var(--fd);font-variant-numeric:tabular-nums}
.stat-v.pulse{animation:statPulse .8s ease}
@keyframes statPulse{0%{transform:scale(1)}40%{transform:scale(1.18);color:var(--gold-lt)}100%{transform:scale(1)}}
.log-entry{font-size:.68rem;color:var(--text-3);padding:2px 0;border-bottom:1px solid rgba(255,255,255,.02);display:flex;justify-content:space-between}
.log-entry span:last-child{color:var(--text-2)}

/* ── 底部音乐条 ── */
#musicBar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;height:72px;
  background:rgba(6,5,18,.90);border-top:1px solid var(--brd);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;gap:16px;padding:0 20px;
}
.album{width:46px;height:46px;border-radius:50%;background:conic-gradient(from 0deg,#2a2048,#3c3070,#2a2048);border:2px solid var(--brd);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;position:relative;box-shadow:0 0 14px rgba(168,144,224,.15)}
.album::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:#06051a;border:1px solid var(--brd);top:50%;left:50%;transform:translate(-50%,-50%)}
.album.spin{animation:spinAlbum 5s linear infinite}
@keyframes spinAlbum{to{transform:rotate(360deg)}}
.track-info{min-width:100px;flex:0 0 auto}
.track-name{font-size:.85rem;color:var(--text-1);font-family:var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.track-sub{font-size:.68rem;color:var(--text-3);margin-top:1px}
.prog-wrap{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.prog-bg{width:100%;height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;cursor:pointer}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--violet),var(--teal));border-radius:3px;width:0%;transition:width .5s linear}
.prog-times{display:flex;justify-content:space-between;font-size:.62rem;color:var(--text-3)}
.bgm-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.cb{width:32px;height:32px;background:transparent;border:1px solid var(--brd);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.88rem;transition:all .18s;color:var(--text-2)}
.cb:hover{background:var(--glass);color:var(--text-1);transform:scale(1.08)}
.cb.play{width:40px;height:40px;background:linear-gradient(135deg,rgba(168,144,224,.28),rgba(168,144,224,.10));border-color:var(--violet);color:var(--violet);font-size:1.05rem}
.cb.play:hover{box-shadow:0 0 12px rgba(168,144,224,.25)}
.vol-wrap{display:flex;align-items:center;gap:5px;flex-shrink:0}
.vol-wrap span{font-size:.78rem;color:var(--text-3)}
.vol-slider{-webkit-appearance:none;appearance:none;width:64px;height:3px;background:rgba(255,255,255,.12);border-radius:3px;outline:none;cursor:pointer}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;background:var(--violet);border-radius:50%;cursor:pointer}
.track-list-btn{padding:4px 10px;background:var(--glass);border:1px solid var(--brd);border-radius:30px;font-size:.7rem;color:var(--text-3);cursor:pointer;transition:all .18s;white-space:nowrap}
.track-list-btn:hover{color:var(--text-2)}
.add-btn{color:var(--teal);border-color:rgba(94,197,180,.45)}
.add-btn:hover{color:var(--teal);background:rgba(94,197,180,.12)}
#toast{position:fixed;left:50%;bottom:calc(var(--mbh,90px) + 16px);transform:translate(-50%,12px);z-index:500;
  background:rgba(8,7,20,.95);border:1px solid rgba(94,197,180,.5);border-radius:30px;padding:9px 18px;
  font-size:.8rem;color:var(--teal);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  box-shadow:0 6px 24px rgba(0,0,0,.6);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:rgba(232,96,112,.6);color:var(--err)}
.track-pill.imported{border-color:rgba(94,197,180,.4)}
.track-pill .tr-del{margin-left:6px;color:var(--text-3);font-size:.8rem;padding:2px 4px;border-radius:4px;flex-shrink:0}
.track-pill .tr-del:hover{color:var(--err);background:rgba(232,96,112,.12)}
#trackPopup .track-pill{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:4px;}
.track-pill .tr-num{font-size:.68rem;color:var(--text-3);min-width:14px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}
.track-pill .tr-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-pill .tr-dur{font-size:.66rem;color:var(--text-3);font-variant-numeric:tabular-nums;flex-shrink:0}
.track-pill.imported{cursor:grab}
.track-pill.imported .tr-num{color:var(--teal)}
.track-pill.dragging{opacity:.45;cursor:grabbing;transform:scale(1.02)}
.tr-mv{color:var(--text-3);font-size:.62rem;padding:2px 3px;border-radius:4px;flex-shrink:0;cursor:pointer;line-height:1}
.tr-mv:hover{color:var(--gold-lt);background:rgba(201,168,110,.14)}
.tr-up:hover,.tr-dn:hover{color:var(--gold-lt)}
.track-pill.imported{touch-action:pan-y}
.track-pill.drop-over{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset;transform:translateX(3px)}
#trackPopup{max-height:min(60vh,420px);overflow-y:auto;}
#trackPopup::-webkit-scrollbar{width:4px}
#trackPopup::-webkit-scrollbar-thumb{background:var(--brd);border-radius:4px}
.tl-hint{font-size:.64rem;color:var(--text-3);padding:2px 4px 6px;border-bottom:1px solid var(--brd);margin-bottom:6px;display:flex;justify-content:space-between}

/* track popup */
#trackPopup{
  display:none;position:fixed;bottom:80px;right:20px;z-index:40;
  background:var(--panel);border:1px solid var(--brd);border-radius:var(--r);
  backdrop-filter:blur(16px);padding:10px;min-width:160px;
  box-shadow:var(--sh);
}
#trackPopup.open{display:block}
.track-pill{padding:5px 12px;border-radius:30px;font-size:.74rem;color:var(--text-3);cursor:pointer;transition:all .18s;white-space:nowrap}
.track-pill:hover{background:var(--glass);color:var(--text-2)}
.track-pill.active{background:rgba(168,144,224,.13);border:1px solid var(--violet);color:var(--violet)}

/* ── Q版角色 ── */
.q-char{position:fixed;z-index:400;width:96px;pointer-events:none;opacity:0;transition:opacity .32s;user-select:none;filter:drop-shadow(0 6px 16px rgba(0,0,0,.55)) drop-shadow(0 0 12px rgba(94,197,180,.25))}
.q-char.on{opacity:1;pointer-events:all}
.qc-look,.qc-turn,.qc-breathe{display:block;width:100%;height:auto;line-height:0}
.qc-look{transform-origin:50% 88%;transition:transform .45s cubic-bezier(.34,1.4,.64,1);will-change:transform}
.qc-turn{transform-origin:50% 92%;will-change:transform}
.qc-turn.idle-turn{animation:qcIdleTurn 7.5s ease-in-out infinite}
.qc-breathe{animation:qcBreathe 3.6s ease-in-out infinite;transform-origin:50% 100%;will-change:transform}
.qc-breathe.d2{animation-duration:4.1s;animation-delay:-1.3s}
.qc-breathe.d3{animation-duration:3.2s;animation-delay:-2.1s}
@keyframes qcBreathe{
  0%,100%{transform:translateY(0) scaleY(1) scaleX(1)}
  45%{transform:translateY(-2px) scaleY(1.022) scaleX(.994)}
  70%{transform:translateY(-1px) scaleY(1.012) scaleX(.997)}
}
/* 待机时偶尔轻轻歪头 —— 模拟"注意到你"的生动感 */
@keyframes qcIdleTurn{
  0%,88%,100%{transform:rotate(0)}
  92%{transform:rotate(-2.2deg)}
  96%{transform:rotate(1.6deg)}
}

.q-char .qc-body{width:100%;height:auto;cursor:grab;user-select:none;-webkit-user-drag:none;display:block;animation:qcFloat 3s ease-in-out infinite;transform-origin:50% 92%}
.q-char .qc-body:active{cursor:grabbing}
.q-char.dragging .qc-body{animation:none;transform:scale(1.06)}
@keyframes qcFloat{0%,100%{transform:translateY(0) rotate(-1deg)}30%{transform:translateY(-5px) rotate(.8deg)}65%{transform:translateY(-6px) rotate(-.7deg)}}

const CHARS=[
{id:"zhuangfangyi",name:"庄方宜",nameEn:"Zhuang Fangyi",img:IMG.zhuangfangyi,fit:"contain",quotes:["都说是读书万卷，行万里路。我读过的书有很多，但去的地方确实不多……确实，我是很容易就能在一个地方，十年、二十年……","武陵城里有很多植物都是天师们从自己家乡带来的……后来，我才明白，他们是将自己打包进了种子，在武陵生根，武陵就是家了。","学得越多，就越是清楚，自己学到的不过沧海一粟。","不怕苦战，只怕无谓之战。","那些期待与期许，我都会好好担在肩上。","谢谢你们。谢谢你们愿意陪我走上这条路。","人还在，那就什么都在。"]},
{id:"adashir",name:"阿达希尔",nameEn:"Adashir",img:IMG.adashir,fit:"contain",quotes:["这是你的梦吗？我也是第一次来这里，也很幸运，能看到管理员的梦境。","你终于对我感兴趣了。","生命是公平的，我只是卑鄙地窃取了我所爱之人的性命……换来了残酷的长生。","和我走吧，回到极光的王冠之下，回到万物发源之地，那里有你想要的一切真相。","留下这枚第纳尔吧，我记得最后一位拥有它的朋友……","如果徒增了你的困扰，我很抱歉。"]},
{id:"admin",name:"管理员",nameEn:"Administrator",img:IMG.admin,fit:"cover",card:true,quotes:["权限已解锁，管理员。","如果被称为英雄的话，那不是应当对这个星球抱以期待和希望吗？大家相信，那便是。","有人说是数次拯救文明的救世主，也有人说是暴君，我是叛徒，但我其实更喜欢和大家在一起的感觉。","你没有忘记最重要的事情，你想仍然善待、想关怀这个饱经风霜的世界。","你在这里等多久了？没关系，我只是刚来。……没有等我，我一个人就够了。骗人。不过也没什么，至少我等到你了。","……爱上了这个世界。"]},
{id:"chenqianyu",name:"陈千语",nameEn:"Chen Qianyu",img:IMG.chenqianyu,fit:"contain",quotes:["剑出，龙腾，风起，云涌。","龙与剑，闯天涯。","有了剑，我就能当大侠了？","大侠啊，大侠的剑，可沉着呢。"]},

{id:"kamille",name:"卡缪·阿尔诺",nameEn:"Kamille Arnaud",img:IMG.kamille,fit:"contain",quotes:["卡缪·阿尔诺，赛什卡的看护人。","我许诺——凡你所到之处，我的血必与你同在。","很久以前，我希望自己的记忆像血液一样……而认识你后，我意识到正是这些不可触碰的事物，塑造了现在的我。","因为我放弃了一半血液，所以现在只能展开半边翅膀……也许某一天，我的伤痕便不会再疼痛了。","要是我突然变成源石虫了你会怎么办？","我们不要再冷战了好吗？"]},
{id:"tangtang",name:"汤汤",nameEn:"Tangtang",img:IMG.tangtang,fit:"contain",quotes:["大当家在此，你、你、还有你，都听我指挥！","行不更名坐改姓，姑奶奶，我就是清波寨的大当家，汤汤！","要更帅气、更传奇，表现出我的威风——重来！","Gotta be cooler，more epic. Show how awesome I am. Again！","游泳、撑船、打水漂儿，跟水有关的事情，我样样都在行！","说到武陵的美食，你去试试武陵城的牢饭，三菜一汤，还会给水果。"]},
];

/* stars */
(function(){const cv=document.getElementById("stars"),ctx=cv.getContext("2d");let s=[];function rz(){cv.width=innerWidth;cv.height=innerHeight;s=[];for(let i=0;i<180;i++)s.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.4+.2,a:Math.random(),da:(Math.random()-.5)*.004});}function dr(){ctx.clearRect(0,0,cv.width,cv.height);for(const p of s){p.a+=p.da;if(p.a<=0||p.a>=1)p.da*=-1;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba(220,210,255,"+p.a+")";ctx.fill();}requestAnimationFrame(dr);}window.addEventListener("resize",rz);rz();dr();})();

/* bg */
const BG=window.__BG__;let bi=0;
document.getElementById("bg").style.backgroundImage="url("+BG[0]+")";
setInterval(function(){bi=(bi+1)%BG.length;document.getElementById("bg").style.backgroundImage="url("+BG[bi]+")";},10000);

/* chars */
/* ══════════ 本地音频导入 ══════════ */
var localTrackSeq=0;
function fmtTime(sec){
  if(!isFinite(sec)||sec<0) return "0:00";
  var m=Math.floor(sec/60),s=Math.floor(sec%60);
  return m+":"+s.toString().padStart(2,"0");
}
function pickLocalAudio(){document.getElementById("audioPicker").click();}
document.getElementById("audioPicker").addEventListener("change",function(){
  var files=this.files;
  if(!files||!files.length) return;
  var added=0,skipped=0,firstNewIdx=TK.length;
  var pending=0;
  for(var i=0;i<files.length;i++){
    var f=files[i];
    if(!/^audio\//.test(f.type) && !/\.(mp3|m4a|wav|ogg|flac|aac)$/i.test(f.name)){skipped++;continue;}
    var url=URL.createObjectURL(f);
    var title=f.name.replace(/\.[^.]+$/,"");
    var item={
      n:title,
      s:"本地音乐 · "+Math.round(f.size/1024/1024*10)/10+" MB",
      d:"--:--",
      t:0,
      file:url,
      local:true,
      id:"local_"+(++localTrackSeq)
    };
    TK.push(item);
    added++;
    // 异步读取真实时长写入标签
    (function(it,u){
      pending++;
      var probe=new Audio();
      probe.preload="metadata";
      var done=function(){
        var dur=probe.duration;
        if(isFinite(dur)&&dur>0){
          it.t=dur;
          it.d=fmtTime(dur);
          refreshTrackLabels();
          if(TK[ct2]===it) document.getElementById("tTot").textContent=it.d;
        }
      };
      probe.addEventListener("loadedmetadata",done);
      probe.addEventListener("durationchange",done);
      probe.addEventListener("error",function(){});
      probe.src=u;
    })(item,url);
  }
  this.value="";
  if(added>0){
    buildTL(lastSelIndex());
    selT(firstNewIdx);
    toggleTrackPopup();
    showToast("已导入 "+added+" 首本地音乐"+(skipped?"，跳过 "+skipped+" 个非音频文件":""));
  }else if(skipped>0){
    showToast("所选文件不是音频格式",true);
  }
});
function lastSelIndex(){return ct2;}
function showToast(msg,isErr){
  var t=document.getElementById("toast");
  if(!t) return;
  t.textContent=msg;
  t.classList.toggle("err",!!isErr);
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer=setTimeout(function(){t.classList.remove("show");},2600);
}
var STORE_KEY="endfield_tavern_v1";
function todayKey(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function loadStore(){
  var blank={totalMin:0,totalCount:0,today:{date:todayKey(),min:0,count:0},charIdx:2,volume:70,mode:"study"};
  try{
    var raw=localStorage.getItem(STORE_KEY);
    if(!raw) return blank;
    var s=JSON.parse(raw)||{};
    var out={
      totalMin:(typeof s.totalMin==="number"&&isFinite(s.totalMin))?Math.max(0,s.totalMin):0,
      totalCount:(typeof s.totalCount==="number"&&isFinite(s.totalCount))?Math.max(0,s.totalCount):0,
      today:(s.today&&typeof s.today==="object")?s.today:null,
      charIdx:(typeof s.charIdx==="number")?s.charIdx:2,
      volume:(typeof s.volume==="number"&&s.volume>=0&&s.volume<=100)?s.volume:70,
      mode:(["study","work","sleep"].indexOf(s.mode)>=0)?s.mode:"study"
    };
    if(!out.today||out.today.date!==todayKey()||typeof out.today.min!=="number"||typeof out.today.count!=="number"){
      out.today={date:todayKey(),min:0,count:0};
    }
    if(out.charIdx<0||out.charIdx>6) out.charIdx=2;
    return out;
  }catch(e){
    return blank;
  }
}
var STORE=loadStore();
function saveStore(){try{localStorage.setItem(STORE_KEY,JSON.stringify(STORE));}catch(e){}}
function fmtMin(m){return m>=60?(Math.floor(m/60)+" 小时 "+(m%60)+" 分"):(m+" 分钟");}
function renderStats(pulse){
  document.getElementById("statToday").textContent=fmtMin(STORE.today.min);
  document.getElementById("statCount").textContent=STORE.today.count+" 次";
  document.getElementById("statTotal").textContent=fmtMin(STORE.totalMin);
  if(pulse){
    ["statToday","statCount","statTotal"].forEach(function(id){
      var el=document.getElementById(id);el.classList.remove("pulse");
      void el.offsetWidth;el.classList.add("pulse");
    });

var gazeX=0,gazeY=0,gazeRaf=null;
function updateGazeSingle(el){
  if(!el||!el._lookEl) return;
  if(el.classList.contains("dragging")){
    el._lookEl.style.transform=el._lookEl._frozen||"";
    return;
  }
  var r=el.getBoundingClientRect();
  if(!r.width) return;
  var cx=r.left+r.width/2, cy=r.top+r.height*0.35;
  var ang=Math.atan2(gazeY-cy,gazeX-cx);
  var dx=Math.cos(ang), dy=Math.sin(ang);
  // 倾斜幅度限制在 ±7°
  var tilt=dx*7;
  el._lookEl.style.transform="rotate("+tilt.toFixed(2)+"deg) translateX("+(dx*3).toFixed(1)+"px) translateY("+(dy*2).toFixed(1)+"px)";
}

/* 按对象引用查找当前索引（排序后索引会变） */
function indexOfTrack(item){
  for(var i=0;i<TK.length;i++){if(TK[i]===item) return i;}
  return -1;

/* 触屏长按拖动排序 */
function bindTouchDrag(row,item){
  var timer=null,dragging=false,startY=0,ghost=null,lastOver=-1;
  row.addEventListener("touchstart",function(e){
    if(e.touches.length!==1) return;
    var touch=e.touches[0];
    startY=touch.clientY;
    timer=setTimeout(function(){
      dragging=true;
      row.classList.add("dragging");
      if(navigator.vibrate) try{navigator.vibrate(12);}catch(err){}
    },260);
  },{passive:true});

  row.addEventListener("touchmove",function(e){
    if(!dragging) return;
    if(e.cancelable) e.preventDefault();
    var y=e.touches[0].clientY;
    var tl=document.getElementById("trackPopup");
    var rows=tl.querySelectorAll(".track-pill");
    var hit=-1;
    for(var k=0;k<rows.length;k++){
      var r=rows[k].getBoundingClientRect();
      if(y>=r.top&&y<=r.bottom){hit=k;break;}
    }
    rows.forEach(function(x){x.classList.remove("drop-over");});
    if(hit>=0&&hit!==indexOfTrack(item)){
      rows[hit].classList.add("drop-over");
      lastOver=hit;
    }
  },{passive:false});

  row.addEventListener("touchend",function(e){
    clearTimeout(timer);
    row.classList.remove("dragging");
    if(dragging){
      row._justDragged=true;
      dragging=false;
      var tl=document.getElementById("trackPopup");
      tl.querySelectorAll(".track-pill").forEach(function(x){x.classList.remove("drop-over");});
      // 在 touchend 里读不到 touch，用最后一次命中的目标
      if(lastOver>=0){
        var from=indexOfTrack(item);
        if(from>=0&&from!==lastOver) moveTrack(from,lastOver>from?lastOver+1:lastOver);
      }
      lastOver=-1;
      setTimeout(function(){row._justDragged=false;},350);
    }
  },{passive:true});

  row.addEventListener("touchcancel",function(){
    clearTimeout(timer);
    dragging=false;
    row.classList.remove("dragging");
    lastOver=-1;
  },{passive:true});
}

/* 把 from 位置的曲目移到 to 位置 */
function moveTrack(from,to){
  if(from===to||!TK[from]) return;
  var curId=TK[ct2]?TK[ct2].id:null;
  var item=TK.splice(from,1)[0];
  if(to>from) to--;
  to=Math.max(0,Math.min(TK.length,to));
  if(item.local && to<builtinCount()) to=builtinCount(); // 最多移到内置曲目之后
  TK.splice(to,0,item);
  // 恢复当前选中项
  if(curId){for(var i=0;i<TK.length;i++){if(TK[i].id===curId){ct2=i;break;}}}
  buildTL(ct2);
  showToast("已调整「"+item.n+"」的位置");
}

    document.getElementById("progFill").style.width="0%";
    document.getElementById("tCur").textContent="0:00";
    document.getElementById("tTot").textContent="0:00";
    buildTL();return;
  }
  if(i<ct2) ct2--;
  if(wasCurrent){
    ct2=Math.min(i,TK.length-1);
    loadTrack(ct2);
    if(wasPlaying) AUD.play();
  }else{
    ct2=Math.min(ct2,TK.length-1);
  }
  buildTL(ct2);
  showToast("已移除该曲目");
}
function selT(i){
  if(!TK[i]) return;
  loadTrack(i);
  if(playing){
    const pr=AUD.play();
    if(pr&&pr.catch) pr.catch(function(){playing=false;document.getElementById("playBtn").textContent="▶";document.getElementById("album").classList.remove("spin");});
  }
}
function togglePlay(){
  if(playing){
    AUD.pause();
    playing=false;
    document.getElementById("playBtn").textContent="▶";
    document.getElementById("album").classList.remove("spin");
  } else {
    AUD.play().then(function(){
      playing=true;
      document.getElementById("playBtn").textContent="⏸";
      document.getElementById("album").classList.add("spin");
    }).catch(function(e){console.warn("Play blocked:",e);});
  }
}
function prevTrack(){selT((ct2-1+TK.length)%TK.length);}
function nextTrack(){selT((ct2+1)%TK.length);}
function toggleLoop(){loop=!loop;document.getElementById("loopBtn").style.color=loop?"var(--violet)":"";}
function seekTrack(e){
  if(!AUD.duration)return;
  const bg=document.getElementById("progBg");
  const pct=Math.max(0,Math.min(1,(e.clientX-bg.getBoundingClientRect().left)/bg.getBoundingClientRect().width));
  AUD.currentTime=pct*AUD.duration;
}
function toggleTrackPopup(){document.getElementById("trackPopup").classList.toggle("open");}
document.addEventListener("click",function(e){if(!e.target.closest("#trackPopup")&&!e.target.closest(".track-list-btn"))document.getElementById("trackPopup").classList.remove("open");});

buildRow();buildTL();renderStats();

/* ── 恢复音量 / 模式 / 角色 ── */
(function(){
  var vs=document.getElementById("volSlider");
  var v=(typeof STORE.volume==="number")?STORE.volume:70;
  vs.value=v;AUD.volume=v/100;
  vs.addEventListener("input",function(){
    AUD.volume=(this.value/100);
    STORE.volume=parseInt(this.value,10);saveStore();
  });
  var savedMode=STORE.mode||"study";
  var btn=document.querySelector('.mode-btn[onclick*="'+savedMode+'"]');
  if(btn) setGM(savedMode,btn); else setTM(savedMode);
  if(typeof STORE.charIdx==="number"&&STORE.charIdx>=0&&STORE.charIdx<CHARS.length){
    document.querySelectorAll(".char-btn").forEach(function(b,j){b.classList.toggle("active",j===STORE.charIdx);});
  }
  saveStore();
})();
function syncBarH(){var b=document.getElementById("musicBar");if(b)document.documentElement.style.setProperty("--mbh",b.offsetHeight+"px");}
syncBarH();window.addEventListener("resize",syncBarH);window.addEventListener("orientationchange",syncBarH);window.addEventListener("load",syncBarH);
</script>
